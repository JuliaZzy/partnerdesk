[project]
name = "partnerdesk"
version = "0.1.0"
description = "Conversational operations agent for a brand's distributors: builds purchase orders through chat, extracts contract terms, ingests sales reports — every action gated by deterministic checks and human confirmation."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3",
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "streamlit>=1.43",
]

[project.optional-dependencies]
# legacy/contract_ai — PDF/DOCX loading and the GLM OCR provider
contract = [
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "zai-sdk>=0.2.2,<1",
]
# legacy/contract_ai — only when CONTRACT_OCR_PROVIDER=textract
textract = ["boto3>=1.34.0"]
# legacy/brand_knowledge — brand-document distillation via Gemini
brand = ["google-genai>=1.0.0"]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["partnerdesk*"]


[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "E741", "RUF001", "RUF002", "RUF003", "RUF059", "B008", "SIM102"]

[tool.pytest.ini_options]
testpaths = ["tests"]
