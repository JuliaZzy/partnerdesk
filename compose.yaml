# Local stack: Postgres + Redis + Milvus + API + Vite desk. Nothing is started on the host.
#   ./dev            bring the stack up (desk http://localhost:5173)
#   ./dev test       pytest inside the api container (needs Postgres)
#
# Base images default to DaoCloud because Docker Hub auth often times out on
# campus networks. Override with POSTGRES_IMAGE / REDIS_IMAGE / MILVUS_IMAGE /
# PYTHON_IMAGE / NODE_IMAGE if you can reach docker.io.
name: partnerdesk

services:
  postgres:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:17-alpine}
    environment:
      POSTGRES_USER: partnerdesk
      POSTGRES_PASSWORD: partnerdesk
      POSTGRES_DB: partnerdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partnerdesk -d partnerdesk"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
    # Not published: tests and the API talk to it on the compose network.

  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    # Not published. The API uses redis://redis:6379/0 on the compose network.

  milvus:
    image: ${MILVUS_IMAGE:-docker.m.daocloud.io/milvusdb/milvus:v2.5.15}
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    volumes:
      - milvusdata:/var/lib/milvus
      - ./deploy/milvus/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    # Not published. The API uses http://milvus:19530 on the compose network.
    # First start is slow: the image is large and standalone embeds etcd.

  api:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim-bookworm}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Compose wins over a leftover .env that still points at 127.0.0.1.
      PARTNERDESK_DB_URL: postgresql+psycopg://partnerdesk:partnerdesk@postgres:5432/partnerdesk
      PARTNERDESK_TEST_DB_URL: postgresql+psycopg://partnerdesk:partnerdesk@postgres:5432/postgres
      PARTNERDESK_REDIS_URL: redis://redis:6379/0
      # Compose wins over a .env that still points Milvus at 127.0.0.1.
      MILVUS_URI: http://milvus:19530
      PYTHONPATH: /app
      WATCHFILES_FORCE_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command:
      - python
      - -m
      - uvicorn
      - backend.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - backend
      - --reload-dir
      - scripts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  pgdata:
  redisdata:
  milvusdata:
  web_node_modules:
