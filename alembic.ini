# Alembic CLI entry point. The URL comes from partnerdesk.config.db_url() (PARTNERDESK_DB_URL
# or the local SQLite file) - see partnerdesk/db/migrations/env.py.
#   .venv\Scripts\alembic upgrade head
#   .venv\Scripts\alembic revision --autogenerate -m "describe the change"
[alembic]
script_location = partnerdesk/db/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
