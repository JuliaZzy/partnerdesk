[project]
name = "partnerdesk"
version = "0.1.0"
description = "Conversational operations agent for a brand's distributors: builds purchase orders through chat, extracts contract terms, ingests sales reports — every action gated by deterministic checks and human confirmation."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13",
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "streamlit>=1.43",
  "psycopg[binary]>=3.2",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
# PDF / Word reading for contracts and brand documents
contract = [
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["partnerdesk*"]

[tool.setuptools.package-data]
partnerdesk = ["db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py"]


[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "E741", "RUF001", "RUF002", "RUF003", "RUF059", "B008", "SIM102"]

[tool.pytest.ini_options]
testpaths = ["tests"]
